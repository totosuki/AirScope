[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airscope-edge"
version = "0.1.0"
description = "AirScope Raspberry Pi edge demo sender"
requires-python = ">=3.11"
dependencies = [
  "azure-iot-device>=2.13.0,<3.0.0",
]

[tool.setuptools]
py-modules = ["airscope_telemetry", "send_adsb", "send_demo_adsb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
